name: Feature request
description: Propose a concrete improvement to AgentLean.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or task
      description: Explain the outcome you cannot achieve with the current workflow.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the change and alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: How would we verify it?
      description: Include meaningful acceptance checks. Distinguish measured efficiency evidence from expectations.
    validations:
      required: true
