name: Release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -m ruff check .
      - run: python scripts/check_docs.py
      - run: python -m ruff format --check agentlean tests scripts
      - run: python -m coverage run --branch -m unittest discover -s tests -v
      - run: python -m coverage report --fail-under=85
      - run: python -m build --outdir release-dist
      - run: python -m twine check --strict release-dist/*.whl release-dist/*.tar.gz
      - run: python scripts/release_check.py release-dist
  package:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install build twine "setuptools>=77"
      - run: python -m build --outdir release-dist
      - run: python -m twine check --strict release-dist/*.whl release-dist/*.tar.gz
      - run: python scripts/check_artifacts.py release-dist --rebuild source-wheel
      - run: python scripts/release_check.py release-dist
      - run: python scripts/release_check.py source-wheel
      - run: python scripts/prepare_source.py --output release-source/agentlean-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: agentlean-release-candidate
          path: |
            release-dist/
            release-source/
          if-no-files-found: error
